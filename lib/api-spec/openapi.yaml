openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: investors
    description: Investor signup operations
  - name: auth
    description: Authentication
  - name: stock
    description: Stock market data
  - name: deposits
    description: Deposit operations
  - name: holdings
    description: User holdings
  - name: trading
    description: Investor buy/sell trading
  - name: config
    description: Public platform configuration
  - name: notifications
    description: Broker notifications sent to investors
  - name: assistant
    description: AI investment assistant chat
  - name: withdrawals
    description: Investor crypto withdrawals
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /investors:
    post:
      operationId: createInvestor
      tags: [investors]
      summary: Sign up for investor access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorInput"
      responses:
        "201":
          description: Investor registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investor"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /investors/count:
    get:
      operationId: getInvestorCount
      tags: [investors]
      summary: Get number of registered investors
      responses:
        "200":
          description: Investor count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorCount"

  /signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with email — returns investor status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Sign in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "404":
          description: Email not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/quote:
    get:
      operationId: getStockQuote
      tags: [stock]
      summary: Get current SPCX stock quote
      responses:
        "200":
          description: Current stock quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockQuote"

  /stock/history:
    get:
      operationId: getStockHistory
      tags: [stock]
      summary: Get SPCX price history
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 1Y, 5Y]
          required: false
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistory"

  /holdings:
    get:
      operationId: getHoldings
      tags: [holdings]
      summary: Get holdings for the current user (by email query param)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holdings"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /withdrawals:
    get:
      operationId: listWithdrawals
      tags: [withdrawals]
      summary: List withdrawal requests for the current user
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User withdrawal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WithdrawalRecord"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createWithdrawal
      tags: [withdrawals]
      summary: Request a crypto withdrawal when access is enabled for the investor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalInput"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRecord"
        "400":
          description: Invalid input or insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Withdrawal access is not enabled for this investor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /site-config:
    get:
      operationId: getSiteConfig
      tags: [config]
      summary: Get public platform configuration (e.g. whether selling is enabled)
      responses:
        "200":
          description: Site configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"

  /trade/buy:
    post:
      operationId: buyShares
      tags: [trading]
      summary: Buy SPCX shares using available cash balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyInput"
      responses:
        "200":
          description: Updated holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holdings"
        "400":
          description: Invalid input or insufficient cash balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Investor not approved for trading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trade/sell:
    post:
      operationId: sellShares
      tags: [trading]
      summary: Sell SPCX shares (only permitted while the admin has selling enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellInput"
      responses:
        "200":
          description: Updated holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holdings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Selling disabled or investor not approved for trading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deposits:
    post:
      operationId: createDeposit
      tags: [deposits]
      summary: Submit a deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepositInput"
      responses:
        "201":
          description: Deposit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listDeposits
      tags: [deposits]
      summary: List deposits for the current user (by email query param)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deposit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositRecord"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /deposit-addresses:
    get:
      operationId: getDepositAddresses
      tags: [deposits]
      summary: Get public crypto deposit addresses
      responses:
        "200":
          description: Deposit addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositAddress"

  /admin/investors:
    get:
      operationId: listAdminInvestors
      tags: [admin]
      summary: List all investors (admin only)
      responses:
        "200":
          description: List of investors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestorAdmin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/investors/{id}/status:
    patch:
      operationId: updateInvestorStatus
      tags: [admin]
      summary: Update investor status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorStatusInput"
      responses:
        "200":
          description: Updated investor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorAdmin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/investors/{id}/credit:
    post:
      operationId: creditInvestor
      tags: [admin]
      summary: Manually credit shares to an investor (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditInput"
      responses:
        "200":
          description: Updated holdings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holdings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/deposits:
    get:
      operationId: listAdminDeposits
      tags: [admin]
      summary: List all deposits (admin only)
      responses:
        "200":
          description: List of deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositAdmin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/deposit-addresses:
    get:
      operationId: adminGetDepositAddresses
      tags: [admin]
      summary: Get all deposit addresses (admin only)
      responses:
        "200":
          description: Deposit addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List broker notifications for the current user (by email query param)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read:
    patch:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationsReadInput"
      responses:
        "200":
          description: Updated notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assistant/chat:
    post:
      operationId: chatWithAssistant
      tags: [assistant]
      summary: Send a message to the AI investment assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Assistant failed to respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/notifications:
    post:
      operationId: sendAdminNotification
      tags: [admin]
      summary: Send a broker notification to an investor by email (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationInput"
      responses:
        "201":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/site-config:
    patch:
      operationId: updateSiteConfig
      tags: [admin]
      summary: Update platform configuration, e.g. enable/disable investor selling (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteConfigUpdate"
      responses:
        "200":
          description: Updated site configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteConfig"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/investors/{id}/withdrawal-access:
    patch:
      operationId: updateInvestorWithdrawalAccess
      tags: [admin]
      summary: Enable or disable withdrawals for one investor (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalAccessInput"
      responses:
        "200":
          description: Updated investor withdrawal access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorAdmin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: List all investor withdrawal requests (admin only)
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawalRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/withdrawals/{id}/status:
    patch:
      operationId: updateWithdrawalStatus
      tags: [admin]
      summary: Update a withdrawal request status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalStatusInput"
      responses:
        "200":
          description: Updated withdrawal request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawalRecord"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Withdrawal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/deposit-addresses/{coin}:
    put:
      operationId: updateDepositAddress
      tags: [admin]
      summary: Update a deposit address (admin only)
      parameters:
        - name: coin
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepositAddressInput"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAddress"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Investor:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - email
        - status
        - createdAt

    InvestorAdmin:
      type: object
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time
        shares:
          type: string
        avgCost:
          type: string
        withdrawalEnabled:
          type: boolean
      required:
        - id
        - fullName
        - email
        - status
        - createdAt
        - shares
        - avgCost
        - withdrawalEnabled

    InvestorInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
      required:
        - fullName
        - email

    InvestorCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    InvestorStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
      required:
        - status

    CreditInput:
      type: object
      properties:
        shares:
          type: number
          minimum: 0
        pricePerShare:
          type: number
          minimum: 0
      required:
        - shares
        - pricePerShare

    WithdrawalAccessInput:
      type: object
      properties:
        withdrawalEnabled:
          type: boolean
      required:
        - withdrawalEnabled

    CreateWithdrawalInput:
      type: object
      properties:
        email:
          type: string
        amount:
          type: number
          minimum: 1
        coin:
          type: string
          enum: [BTC, ETH, DOGE]
        address:
          type: string
          minLength: 10
      required:
        - email
        - amount
        - coin
        - address

    WithdrawalStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [pending, completed, failed]
      required:
        - status

    WithdrawalRecord:
      type: object
      properties:
        id:
          type: integer
        investorId:
          type: integer
        email:
          type: string
        amount:
          type: string
        coin:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - investorId
        - email
        - amount
        - coin
        - address
        - status
        - createdAt

    AdminWithdrawalRecord:
      allOf:
        - $ref: "#/components/schemas/WithdrawalRecord"
        - type: object
          properties:
            fullName:
              type: string
          required:
            - fullName

    SignInInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    SignInResult:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        fullName:
          type: string
        email:
          type: string
      required:
        - status
        - fullName
        - email

    Holdings:
      type: object
      properties:
        investorId:
          type: integer
        shares:
          type: string
        avgCost:
          type: string
        cashBalance:
          type: string
        withdrawalEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required:
        - investorId
        - shares
        - avgCost
        - cashBalance
        - withdrawalEnabled
        - updatedAt

    Notification:
      type: object
      properties:
        id:
          type: integer
        investorId:
          type: integer
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - investorId
        - message
        - read
        - createdAt

    MarkNotificationsReadInput:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    SendNotificationInput:
      type: object
      properties:
        email:
          type: string
        message:
          type: string
          minLength: 1
      required:
        - email
        - message

    AssistantChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    AssistantChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantChatMessage"
      required:
        - messages

    AssistantChatResponse:
      type: object
      properties:
        reply:
          type: string
        showOrderButton:
          type: boolean
      required:
        - reply
        - showOrderButton

    SiteConfig:
      type: object
      properties:
        sellingEnabled:
          type: boolean
      required:
        - sellingEnabled

    SiteConfigUpdate:
      type: object
      properties:
        sellingEnabled:
          type: boolean
      required:
        - sellingEnabled

    BuyInput:
      type: object
      properties:
        email:
          type: string
        amountUsd:
          type: number
          minimum: 0.01
      required:
        - email
        - amountUsd

    SellInput:
      type: object
      properties:
        email:
          type: string
        shares:
          type: number
          minimum: 0.0001
      required:
        - email
        - shares

    CreateDepositInput:
      type: object
      properties:
        email:
          type: string
        amount:
          type: number
          minimum: 1
        method:
          type: string
          enum: [card, crypto]
        coin:
          type: string
          enum: [BTC, ETH, DOGE]
      required:
        - email
        - amount
        - method

    DepositRecord:
      type: object
      properties:
        id:
          type: integer
        investorId:
